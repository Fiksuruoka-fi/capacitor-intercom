on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: Release

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release please
        # Opens/updates the release PR (version bump + CHANGELOG). When that PR is
        # merged, it creates the git tag and a DRAFT GitHub Release. Publishing the
        # draft fires the Publish workflow (see publish.yml). Config lives in
        # release-please-config.json and .release-please-manifest.json.
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
