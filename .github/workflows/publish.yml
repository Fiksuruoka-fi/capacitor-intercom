name: Publish

on:
  # Fires when the draft release created by release-please is published.
  # Draft releases do not trigger `created`, so we listen for `published`.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      # `prepublishOnly` runs `npm run build` before packing.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
